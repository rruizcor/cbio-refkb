[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbio-refkb"
version = "0.1.0"
description = "Versioned cancer-cohort reference layer built from the public cBioPortal database, for annotating somatic calls from Illumina WES/WTS and ONT pipelines."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
refkb = "refkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refkb = ["sql/*.sql"]
